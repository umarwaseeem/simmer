name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation first, then the idea. "When I ..., I want ..., so that ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Charging and limits
        - Menu bar panel
        - Settings
        - Widgets
        - Shortcuts, URL scheme or CLI
        - Raycast extension
        - Insights and history
        - Other
